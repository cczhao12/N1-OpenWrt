name: Build ImmortalWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:
# 每月 1 日 / 16 日 08:00 的定时构建已停用，只留手动触发：
#  schedule:
#    - cron: "0 0 1,16 * *"

# fork 仓库的 GITHUB_TOKEN 默认可能是只读，没有这行 gh release create 会 403
permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/precheck.sh feeds

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          cp armsr/armv8/N1/.config /tmp/n1-requested.config
          mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/precheck.sh config
          make download -j$(( $(nproc) * 2 ))

      - name: Compile N1 firmware
        working-directory: ./openwrt
        run: |
          make -j$(( $(nproc) + 1 )) || make -j1 V=s

      - name: Package N1 firmware
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_usage: flippy
          openwrt_kernel: 6.12.y
          openwrt_size: 256/1024
          builder_name: cczhao12

      - name: Upload firmware to release
        run: |
          tag="OpenWrt_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "$(printf '首次使用建议全新刷写\n* 基本信息\nIP: 192.168.6.69\n网关: 192.168.6.1\n账户: root\n密码: password\n* 已预装 PassWall2(全核心) 与网页终端(服务->TTYD)\n* LAN 口 DHCP 已关闭，避免与主路由冲突')" 2> /dev/null || true
          gh release upload $tag ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | tail -n +3 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
